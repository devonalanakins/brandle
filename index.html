<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071b17">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="BRANDLE: A little word magic for Brandi. Five letters. Six chances. Maximum drama.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="BRANDLE ✦ The Glimmer Grove">
  <meta property="og:description" content="A little word magic for Brandi. Five letters. Six chances. Maximum drama.">
  <meta property="og:image" content="https://brandle-glimmer-grove.devonakins.workers.dev/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BRANDLE">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./glimmer-v2.css">
  <title>BRANDLE — The Glimmer Grove</title>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="aurora one"></div><div class="aurora two"></div><div class="aurora three"></div>
    <div class="orbits"></div>
    <svg class="forest-canopy" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path d="M-60 -20 C64 120 105 161 114 281 M-40 111 C92 178 130 210 152 270 M-20 262 C55 240 84 215 98 174 M450 -30 C320 80 294 153 277 250 M460 128 C359 178 311 190 277 262 M431 257 C360 231 322 214 302 169 M-21 610 C46 516 77 494 117 473 M413 640 C349 525 325 482 291 471 M-5 808 C67 718 100 700 153 686 M391 823 C344 739 298 706 247 689"/><path d="M113 279q-45-16-62-45m62 45q23-53 61-65m-74-36q-43 0-68-31m270 103q37-41 66-33m-66 33q-20-43-52-52m-137 512q-32-21-73-12m248-3q33-22 61-9" stroke-width="1.2"/></svg>
    <div id="fireflies"></div>
  </div>
  <div class="shell">
    <header class="header">
      <div class="identity">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="bmark" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff5d4"/><stop offset=".48" stop-color="#f6b67f"/><stop offset="1" stop-color="#f18354"/></linearGradient></defs>
            <path d="M12 38V10h13c7 0 10 3.5 10 8 0 3.1-1.9 5.2-4.4 6.4 3.9 1.1 6 3.5 6 6.9 0 4.3-3.7 6.7-10.6 6.7H12Zm8-17h5.2c2.2 0 3.3-1 3.3-2.8s-1.2-2.7-3.3-2.7H20V21Zm0 11h6.4c2.3 0 3.5-1 3.5-2.9 0-1.8-1.2-2.9-3.5-2.9H20V32Z" fill="url(#bmark)"/>
            <path d="M33.5 10.5C35 5 40 3.5 44 4c-.8 4.8-4 8.5-9.2 9.2" fill="#b2f5cb"/><path d="M34.7 12c1.7-2.5 3.8-4.3 6.4-5.7" fill="none" stroke="#174c3a" stroke-width="1.5"/>
          </svg>
        </div>
        <div><h1 class="wordmark">BRANDLE</h1><div class="submark">THE GLIMMER GROVE</div></div>
      </div>
      <nav class="header-actions" aria-label="Game tools">
        <button type="button" id="help-button" class="icon-button" aria-label="How to play" title="How to play"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 1c0 2-3 2.4-3 4"/><path d="M12 18h.01"/></svg></button>
        <button type="button" id="stats-button" class="icon-button" aria-label="Statistics" title="Statistics"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 20V11M10 20V5M15 20v-8M20 20V8" stroke-width="3"/></svg></button>
        <button type="button" id="settings-button" class="icon-button" aria-label="Settings" title="Settings"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M3 11v2l2.2.7.8 2 1.9 1.2 2.1-.9 2 .3 1.5 1.6 2-.7.7-2.1 1.9-1.4 2.2.1.7-2-.8-2-2.1-.8-1-2.1.5-2-1.9-1.1-2.1 1.1-2.2-.2L10 2.5l-2.1.7-.5 2.2-2 1.2-2.1-.2-.8 2 1.1 2Z"/></svg></button>
      </nav>
    </header>
    <main class="main">
      <div class="hero">
        <p class="eyebrow">a little word magic for Brandi</p>
        <h2>Let the <em>words</em> bloom.</h2>
        <p id="mode-sub">One shared word. A fresh bloom every day.</p>
      </div>
      <div class="mode" role="group" aria-label="Game mode">
        <button type="button" id="mode-daily" class="selected" aria-pressed="true"><small>✦</small> DAILY GROVE</button>
        <button type="button" id="mode-wild" aria-pressed="false"><small>✧</small> WILD RUN</button>
      </div>
      <section class="game" aria-label="BRANDLE puzzle">
        <div class="topline"><div id="board-title">THE DAILY BLOOM</div><div id="puzzle-label">TODAY'S GROVE</div><div id="progress-indicator" class="progress">01 / 06</div></div>
        <div class="board-outer">
          <div id="board" class="board" role="grid" aria-label="Word grid, six rows and five columns"></div>
        </div>
        <div class="legend" aria-label="Color legend"><span><i class="correct"></i>Right spot</span><span><i class="present"></i>Other spot</span><span><i class="absent"></i>Not there</span></div>
        <div class="bottom-line">
          <p id="status-line" aria-live="polite" aria-atomic="true">THE GROVE AWAITS YOUR WORD</p>
          <div class="button-strip">
            <button type="button" id="result-button" class="quiet-button" hidden>View results</button>
            <button type="button" id="next-button" class="bloom-button" hidden>✦ Next Bloom</button>
          </div>
        </div>
        <div id="keyboard" class="keyboard" aria-label="On-screen keyboard"></div>
        
      </section>
    </main>
    <footer class="footer"><span><i class="dot"></i> <span id="footer-text">Made for Brandi · Daily Grove</span></span><span id="clock-strip" class="clock-strip">NEXT BLOOM <strong id="next-countdown">--:--:--</strong></span></footer>
  </div>
  <div id="confetti" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" class="modal" aria-label="BRANDLE game dialog">
    <button type="button" class="modal-close" id="modal-close" aria-label="Close dialog">×</button>
    <div id="modal-body" class="modal-body"></div>
  </dialog>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
